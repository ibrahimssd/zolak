# Zolak backend on one small VM: the chatbot app behind Caddy (automatic HTTPS via Let's Encrypt).
# Configuration lives in deploy/oracle/.env (written by setup.sh, never committed).
services:
  zolak:
    build:
      context: ../..
      dockerfile: deploy/oracle/Dockerfile
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "7860"
      N_THREADS: "2"
    # No `cpus:` limit on purpose: a CFS CPU quota makes llama.cpp's spin-waiting threads stall
    # (measured: no answer after 8+ min under --cpus 2 vs ~1 min pinned to 2 cores).
    volumes:
      - hf-cache:/root/.cache/huggingface   # model + embedder survive rebuilds
      - feedback:/app/feedback              # pending 👍/👎 rows before upload
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      ZOLAK_DOMAIN: ${ZOLAK_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - zolak
    restart: unless-stopped

volumes:
  hf-cache: {}
  feedback: {}
  caddy-data: {}
  caddy-config: {}
