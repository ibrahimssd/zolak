name: Privacy scan + tests

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Block chat data / personal data in the repo
        run: python scripts/pii_scan.py $(git ls-files)
      - name: Unit tests (data-dependent leak tests skip in CI)
        run: |
          pip install pytest
          python -m pytest -q tests
