name: Deploy web chat to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Cache-bust CSS/JS (a new page must never pair with a stale stylesheet)
        run: |
          v="${GITHUB_SHA::7}"
          sed -i -E "s#href=\"style\.css\"#href=\"style.css?v=${v}\"#; s#src=\"app\.js\"#src=\"app.js?v=${v}\"#" web/index.html
          grep -oE '(style\.css|app\.js)\?v=[0-9a-f]+' web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
